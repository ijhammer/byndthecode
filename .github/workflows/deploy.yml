name: Update Episodes & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'   # 7am UTC (9am Israel) daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update episodes data from RSS + YouTube
        run: python3 scripts/update_episodes.py

      - name: Commit updated episodes if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes-data.js
          if git diff --staged --quiet; then
            echo "No episode changes."
          else
            git commit -m "chore: update episodes data [skip ci]"
            git push
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
